# Render blueprint for the OPflow API (Render → New → Blueprint → pick the opflow-backend repository).
# One web service runs the API AND the background jobs (JOBS_IN_API=true): simplest for a test server.
# Region: Singapore, the closest Render region to the database (Supabase, Mumbai).
#
# DEMO_MODE: a staging test server before the real accounts exist. Payments, SMS/email/push and file storage use
# stand-ins; patient login uses DEMO_OTP_CODE instead of Firebase. Never used in production (the server refuses).
# Values marked "sync: false" are secrets: Render asks for them once (see docs/DEPLOY_RENDER.md).
services:
  - type: web
    name: opflow-api
    runtime: docker
    region: singapore
    plan: starter
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    autoDeploy: true
    buildFilter:
      ignoredPaths:
        - docs/**
        - migrations/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_OTP_CODE
        sync: false
      - key: JOBS_IN_API
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_MAX
        value: "5"
      # Supabase Root 2021 CA (public certificate; valid until Apr 2031). The database certificate is verified.
      - key: DB_SSL_CA_B64
        value: 
      - key: JWT_ACCESS_PRIVATE_KEY_B64
        sync: false
      - key: JWT_ACCESS_PUBLIC_KEY_B64
        sync: false
      - key: JWT_KEY_ID
        value: 2026-09
      - key: JWT_ISSUER
        value: https://api.opflow.in
      - key: PASSWORD_PEPPER
        sync: false
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: STORAGE_PROVIDER
        value: local
      - key: CORS_ORIGINS
        value: http://localhost:3002
      - key: ADMIN_PUBLIC_URL
        value: http://localhost:3002

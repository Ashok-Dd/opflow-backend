name: backend

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # A throwaway Postgres: every migration is applied, then the end-to-end journeys run against it.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DIRECT: postgres://postgres:postgres@localhost:5432/opflow_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Apply all migrations (dbmate)
        run: |
          curl -fsSL -o /usr/local/bin/dbmate https://github.com/amacneil/dbmate/releases/download/v2.36.0/dbmate-linux-amd64
          chmod +x /usr/local/bin/dbmate
          DATABASE_URL="$DIRECT" dbmate --migrations-dir migrations --no-dump-schema up
          psql "$DIRECT" -c "alter role opflow_api login password 'ci-only'"
      - name: End-to-end journeys (booking, payment, live line, refunds, admin)
        run: npm run test:flow
        env:
          FLOW_DATABASE_URL: postgres://opflow_api:ci-only@localhost:5432/opflow_test

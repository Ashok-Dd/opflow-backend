# Fly.io deploy (Mumbai). Secrets are set with `fly secrets set KEY=value` — never in this file.
app = "opflow-api"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "staging"
  PORT = "3000"
  TRUST_PROXY = "true"
  LOG_LEVEL = "info"

[processes]
  api = "node dist/main.js"
  worker = "node dist/worker.js"

[http_service]
  processes = ["api"]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 2

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    path = "/ready"
    timeout = "5s"

[[vm]]
  processes = ["api", "worker"]
  size = "shared-cpu-1x"
  memory = "512mb"
